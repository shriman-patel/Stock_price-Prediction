<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Stock Price Predictor</h1>
        <form method="POST">
            <input type="text" name="symbol" placeholder="Enter Ticker (e.g. AAPL, RELIANCE.NS)" required>
            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <div class="result">
                <h3>Result for {{ symbol }}:</h3>
                <p>Estimated Tomorrow's Price: <strong>${{ "%.2f"|format(prediction) }}</strong></p>
            </div>
        {% endif %}
    </div>
</body>
</html>
